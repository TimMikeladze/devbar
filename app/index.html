<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>devbar.sh — Point at what to change. Your agent ships it.</title>
		<meta
			name="description"
			content="Open-source drop-in toolbar for any website. Point at an element, capture its selector, computed styles, React tree and source file, and hand the report to a coding agent running in your repo — over MCP."
		/>

		<link rel="canonical" href="https://devbar.sh" />
		<meta name="theme-color" content="#0a0a0a" />

		<!-- Prevent flash of wrong theme on load -->
		<script>
			(function () {
				var t = "system";
				try {
					t = localStorage.getItem("devbar-theme") || "system";
				} catch (e) {}
				var dark =
					t === "dark" ||
					(t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				if (dark) document.documentElement.classList.add("dark");
				else document.documentElement.classList.remove("dark");
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#fafafa");
			})();
		</script>

		<!-- Prevent flash of default border/outline before CSS settles -->
		<style>
			html,
			body,
			#root {
				border: 0;
				outline: 0;
			}
		</style>

		<!-- SEO -->
		<meta
			name="keywords"
			content="devbar, drop-in toolbar, element inspector, UI annotation, visual feedback tool, agent-ready prompt, coding agent, AI agent, MCP server, Claude Code, Cursor, Codex, opencode, React component tree, React fiber, XPath capture, CSS selector, computed styles, source file location, screenshot annotation, screen recording, structured bug report, QA tool, design review tool, Chrome extension, developer tools, open source, MIT licensed"

		<!-- JSON-LD: SoftwareApplication -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "devbar.sh",
				"alternateName": ["devbar", "devbar toolbar", "devbar inspector"],
				"description": "Open-source drop-in toolbar for any website. Point at an element to capture its selector, computed styles, React component tree and source file, then hand the report to a coding agent running in your repository — over MCP, a webhook, or a one-click export.",
				"url": "https://devbar.sh",

				"applicationCategory": "DeveloperApplication",
				"applicationSubCategory": "Annotation & QA",
				"operatingSystem": "Any",
				"featureList": [
					"Element inspector: XPath, CSS selector, computed styles, bounding rect and HTML",
					"React component tree and source file locations from the fiber tree",
					"Freehand drawing, numbered markers, region and full-page screenshots, tab recording",

					"Local agent dispatch to Claude Code, Codex or opencode running in your repository",
					"Stdio MCP server for pulling reports and inspecting the live page",
					"Webhook and callback delivery",
					"Chrome extension and CDN script tag for any site",

				],
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
				"author": {

					"name": "Tim Mikeladze",
					"url": "https://github.com/TimMikeladze"
				},
				"codeRepository": "https://github.com/TimMikeladze/devbar",
				"license": "https://opensource.org/licenses/MIT",
				"programmingLanguage": ["TypeScript", "JavaScript"],
				"runtimePlatform": "Browser"
			}
		</script>

		<!-- JSON-LD: FAQPage — every entry below is also rendered in the page's FAQ
		     section, word for word. Structured data that a visitor cannot find on
		     the page is a rich-result violation, so keep the two in step;
		     test/landing-metadata.test.ts fails when they drift. Questions whose
		     answer text depends on a build flag stay out of here. -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "FAQPage",
				"mainEntity": [
					{
						"@type": "Question",
						"name": "How does this work with AI agents?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Paste the context into Cursor, Claude, or ChatGPT — or connect over MCP, onSubmit, or a webhook so your agent picks up changes automatically."
						}
					},
					{
						"@type": "Question",
						"name": "What does the MCP server actually do?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "devbar mcp is a stdio MCP server your agent spawns. It reads the report queue you captured in the browser, and — once you switch on Agent live — inspects, screenshots, and highlights the page you have open, through the local devbar server. It is stateless, so several sessions can share one queue."
						}
					},
					{
						"@type": "Question",
						"name": "Does the agent run on my machine?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes, and only there. The server binds 127.0.0.1, authorizes requests by origin, and defaults to permission \"plan\" with auto-dispatch off — so nothing runs in your repo until you ask for it."
						}
					},
					{
						"@type": "Question",
						"name": "Does it work without React?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes. Every tool works on any website. React component context is an automatic bonus when a fiber tree is detected."
						}
					},
					{
						"@type": "Question",
						"name": "Will it slow down my app?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "No. The toolbar renders in its own isolated DOM container with zero background overhead."
						}
					},
					{
						"@type": "Question",
						"name": "Why not just use browser DevTools?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "DevTools is for one developer debugging alone. devbar lets anyone — design, PM, QA — point at a change and hand off the exact context."
						}
					}
				]
			}
		</script>

		<!-- JSON-LD: WebSite -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "devbar.sh",
				"url": "https://devbar.sh"
			}
		</script>

	<body class="antialiased">
		<div id="root"></div>
		<noscript>
			<h1>devbar.sh — Point at what to change. Your agent ships it.</h1>
			<p>
				Stop describing UI changes in Slack. Point at any element and hand your coding agent the
				exact context to make the change.
			</p>
			<p>
				Open-source drop-in toolbar that turns visual website annotations into agent-ready reports.
				Captures XPaths, CSS selectors, computed styles, React component trees, source file
				locations, screenshots and recordings — for an agent running in your repository, an MCP
				session, a webhook, or a report you attach to a ticket.
			</p>
			<h2>How it works</h2>
			<ol>
				<li>
					<strong>Annotate</strong> — Select elements, draw freehand, drop numbered markers, capture
					a region or the whole page, or record the tab. Say what you want changed in the task
					field.
				</li>
				<li>
					<strong>Auto-capture</strong> — Every annotation extracts XPaths, CSS selectors, computed
					styles, React component trees, and source file locations.
				</li>
				<li>
					<strong>Hand it off</strong> — One click copies the prompt, saves a Markdown, JSON, HTML
					or PDF report, POSTs to a webhook, or submits it to the local devbar server, which
					dispatches it to an agent CLI running in your repository.
				</li>
			</ol>
			<h2>Who it's for</h2>
			<ul>
				<li>
					<strong>Coding agents &amp; MCP</strong> — Dispatch to Claude Code, Codex or opencode in
					your repo, or let an open agent session pull reports over MCP.
				</li>
				<li>
					<strong>Developers</strong> — Feed structured UI context directly into coding assistants.
				</li>
				<li>
					<strong>Designers &amp; QA</strong> — File reports with exact CSS values, bounding rects,
					and screenshots.
				</li>
				<li>
					<strong>Product managers</strong> — Give feedback on staging without leaving the browser.
				</li>
			</ul>
			<h2>Features</h2>
			<ul>
				<li>Element inspector with XPath &amp; CSS selector capture</li>
				<li>React component tree extraction with source file locations</li>
				<li>Freehand drawing with context screenshots</li>
				<li>Screenshot capture (region or full page) and tab recording</li>
				<li>Numbered markers with nearest-element detection</li>
				<li>A task field that leads the exported prompt with what you actually want changed</li>
				<li>Markdown, JSON, standalone HTML and PDF reports</li>
				<li>Local agent dispatch — Claude Code, Codex or opencode, with live run output</li>
				<li>Stdio MCP server, webhooks, and clipboard integration</li>
				<li>Chrome extension and CDN script tag for any website</li>
				<li>Custom prompt templates</li>
				<li>Plugin system</li>
			</ul>
			<h2>FAQ</h2>
			<dl>
				<dt>How does this work with AI agents?</dt>
				<dd>
					Paste the context into Cursor, Claude, or ChatGPT — or connect over MCP, onSubmit, or a
					webhook so your agent picks up changes automatically.
				</dd>
				<dt>What does the MCP server actually do?</dt>
				<dd>
					devbar mcp is a stdio MCP server your agent spawns. It reads the report queue you captured
					in the browser, and — once you switch on Agent live — inspects, screenshots, and
					highlights the page you have open, through the local devbar server. It is stateless, so
					several sessions can share one queue.
				</dd>
				<dt>Does the agent run on my machine?</dt>
				<dd>
					Yes, and only there. The server binds 127.0.0.1, authorizes requests by origin, and
					defaults to permission "plan" with auto-dispatch off — so nothing runs in your repo until
					you ask for it.
				</dd>
				<dt>Does it work without React?</dt>
				<dd>
					Yes. Every tool works on any website. React component context is an automatic bonus when a
					fiber tree is detected.
				</dd>
				<dt>Will it slow down my app?</dt>
				<dd>
					No. The toolbar renders in its own isolated DOM container with zero background overhead.
				</dd>
				<dt>Why not just use browser DevTools?</dt>
				<dd>
					DevTools is for one developer debugging alone. devbar lets anyone — design, PM, QA — point
					at a change and hand off the exact context.
				</dd>
			</dl>
			<p><a href="https://github.com/TimMikeladze/devbar">View on GitHub</a></p>
		</noscript>
