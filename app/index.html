		<title>devbar.sh — Point at any UI. Ship the change with your agent.</title>
		<meta
			name="description"
			content="Open-source drop-in inspector for any website. Point at an element, capture the exact context — selectors, styles, React tree, source file — and hand it to your AI agent, a GitHub issue, or your team. Iterate at agent speed."
		/>

		<link rel="canonical" href="https://devbar.sh" />
		<meta name="theme-color" content="#0a0a0a" />

		<!-- Prevent flash of wrong theme on load -->
		<script>
			(function () {
				var t = "system";
				try {
					t = localStorage.getItem("devbar-theme") || "system";
				} catch (e) {}
				var dark =
					t === "dark" ||
					(t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				if (dark) document.documentElement.classList.add("dark");
				else document.documentElement.classList.remove("dark");
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#fafafa");
			})();
		</script>

		<!-- Prevent flash of default border/outline before CSS settles -->
		<style>
			html,
			body,
			#root {
				border: 0;
				outline: 0;
			}
		</style>

	<body class="antialiased">
		<div id="root"></div>
		<noscript>
			<h1>devbar.sh — Point at any UI, ship the change with your agent</h1>
			<p>
				Stop describing UI changes in Slack. Point at any element and hand your AI agent the exact
				context to make the change.
			</p>
			<p>
				Open-source toolbar that turns visual website annotations into structured, AI-ready bug
				reports. Captures XPaths, computed styles, React component trees, source file locations, and
				screenshots — ready for any LLM, MCP agent, or webhook pipeline.
			</p>
			<h2>How it works</h2>
			<ol>
				<li>
					<strong>Annotate</strong> — Select elements, draw freehand, drop numbered markers, or
					capture screenshots.
				</li>
				<li>
					<strong>Auto-capture</strong> — Every annotation extracts XPaths, CSS selectors, computed
					styles, React component trees, and source file locations.
				</li>
				<li>
					<strong>Export</strong> — One click turns everything into structured Markdown, JSON, or a
					webhook POST. Pipe to any LLM or AI agent via MCP.
				</li>
			</ol>
			<h2>Who it's for</h2>
			<ul>
				<li>
					<strong>AI agents &amp; MCP</strong> — Connect via MCP server, webhooks, or callbacks for
					agentic workflows.
				</li>
				<li>
					<strong>Developers</strong> — Feed structured bug context directly into coding assistants.
				</li>
				<li>
					<strong>Designers &amp; QA</strong> — File bug reports with exact CSS values, bounding
					rects, and screenshots.
				</li>
				<li>
					<strong>Product managers</strong> — Give feedback on staging without leaving the browser.
				</li>
			</ul>
			<h2>Features</h2>
			<ul>
				<li>Element inspector with XPath &amp; CSS selector capture</li>
				<li>React component tree extraction with source file locations</li>
				<li>Freehand drawing with context screenshots</li>
				<li>Screenshot capture (full page or region)</li>
				<li>Numbered markers with nearest-element detection</li>
				<li>LLM-ready Markdown and JSON export</li>
				<li>MCP server, webhooks, and clipboard integration</li>
				<li>Chrome extension for any website</li>
				<li>Custom prompt templates</li>
				<li>Plugin system</li>
			</ul>
			<h2>FAQ</h2>
			<dl>
				<dt>How does this work with AI agents?</dt>
				<dd>
					Connect via the built-in MCP server, an onSubmit callback, or a webhook URL. Structured
					context flows directly into Claude, Cursor, or your own agentic pipeline.
				</dd>
				<dt>Does it work without React?</dt>
				<dd>
					Yes. XPaths, CSS selectors, computed styles, drawing, screenshots, and markers work on any
					website.
				</dd>
				<dt>How does React context extraction work?</dt>
				<dd>
					devbar reads the React fiber node and walks up the tree, capturing every component's name,
					props, and source file location — all locally in your browser.
				</dd>
			</dl>
			<p><a href="https://github.com/TimMikeladze/devbar">View on GitHub</a></p>
