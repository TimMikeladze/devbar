		<!-- JSON-LD: SoftwareApplication -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "deloop.dev",
				"alternateName": ["deloop", "website annotation tool", "LLM prompt generator", "visual bug reporter"],
				"description": "Open-source drop-in toolbar for annotating any website. Select elements to capture XPaths, CSS selectors, computed styles, and React component context. Draw, place markers, take screenshots, and generate structured Markdown prompts ready for any LLM.",
				"url": "https://deloop.dev",
				"applicationCategory": "DeveloperApplication",
				"applicationSubCategory": "Annotation & QA",
				"operatingSystem": "Any",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				},
				"author": {
					"@type": "Person",
					"name": "Tim Mikeladze",
					"url": "https://github.com/TimMikeladze",
					"sameAs": [
						"https://x.com/linesofcode",
						"https://bsky.app/profile/linesofcode.bsky.social",
						"https://github.com/TimMikeladze"
					]
				},
				"codeRepository": "https://github.com/TimMikeladze/deloop",
				"license": "https://opensource.org/licenses/MIT",
				"programmingLanguage": ["TypeScript", "JavaScript"],
				"runtimePlatform": "Browser",
				"featureList": [
					"Element inspector with XPath, CSS selector, and computed styles capture",
					"React fiber tree walker for component hierarchy, props, and source locations",
					"Freehand drawing annotations with context screenshots",
					"Full-page and region screenshot capture",
					"Numbered marker pins with nearest element detection",
					"Structured Markdown prompt generation for LLMs",
					"Custom prompt template support",
					"Clipboard copy, JSON/Markdown file export, and webhook delivery",
					"Chrome extension for annotating any website",
					"CDN script tag — no build step required",
					"React component and programmatic init APIs",
					"Plugin system for custom tools and panels",
					"Light, dark, and auto theme with configurable position"
				]
			}
		</script>

		<!-- JSON-LD: FAQPage -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "FAQPage",
				"mainEntity": [
					{
						"@type": "Question",
						"name": "Why not a browser DevTools extension?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "DevTools is for developers. deloop.dev is a toolbar you embed in your app so anyone — designers, QA, PMs — can annotate issues and generate LLM-ready context without leaving the page."
						}
					},
					{
						"@type": "Question",
						"name": "How does React context extraction work?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "When you select an element, deloop walks the React fiber tree to find the component hierarchy, props, and source file locations. This gives the LLM enough context to suggest exact code changes."
						}
					},
					{
						"@type": "Question",
						"name": "Does deloop.dev work without React?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes. React context extraction is automatic when React is detected, but all other features — element selection, XPaths, CSS selectors, drawing, screenshots, markers — work on any website."
						}
					},
					{
						"@type": "Question",
						"name": "What output formats are supported?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Copy to clipboard as Markdown, download as JSON or Markdown files, or POST to a webhook URL. Images can be embedded as base64 or exported as separate files."
						}
					},
					{
						"@type": "Question",
						"name": "Can I customize the prompt?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes. Pass a promptTemplate function that receives all annotations, page URL, viewport, user agent, and settings. Return any string you want — Markdown, XML, plain text."
						}
					},
					{
						"@type": "Question",
						"name": "How do I use deloop on sites I don't own?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Install the Chrome extension. It injects the toolbar into any page without modifying the source code."
						}
					},
					{
						"@type": "Question",
						"name": "Does deloop affect my app's performance?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "The toolbar renders in its own DOM container and only captures data when you interact with it. No polling, no mutation observers running in the background."
						}
					}
				]
			}
		</script>

		<!-- JSON-LD: WebSite -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "deloop.dev",
				"url": "https://deloop.dev",
				"description": "Open-source drop-in annotation toolbar for any website with LLM prompt generation"
			}
		</script>

		<!-- JSON-LD: HowTo -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "HowTo",
				"name": "How to annotate a website and generate an LLM prompt with deloop.dev",
				"description": "Install deloop.dev and start annotating any website to generate structured prompts for AI-powered bug fixes in under 60 seconds.",
				"step": [
					{
						"@type": "HowToStep",
						"name": "Install deloop.dev",
						"text": "Run 'bun add deloop.dev' to install the package, or add the CDN script tag to your HTML."
					},
					{
						"@type": "HowToStep",
						"name": "Add the toolbar",
						"text": "Render the <Deloop /> React component, call init() programmatically, or use the Chrome extension."
					},
					{
						"@type": "HowToStep",
						"name": "Annotate the page",
						"text": "Use the toolbar tools to select elements, draw annotations, place markers, and capture screenshots."
					},
					{
						"@type": "HowToStep",
						"name": "Submit and prompt",
						"text": "Click submit to copy the structured prompt to your clipboard, download it as a file, or send it to a webhook. Paste into any LLM for AI-powered fixes."
					}
				]
			}
		</script>
	</head>

</html>
