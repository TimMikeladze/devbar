name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'prod' || 'dev' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'release' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deploy target
        id: target
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "app=deloop-prod" >> "$GITHUB_OUTPUT"
          else
            echo "app=deloop-dev" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: |
          flyctl deploy \
            --app "$FLY_APP" \
            --build-arg VITE_STRIPE_TEAM_PRICE_ID="$VITE_STRIPE_TEAM_PRICE_ID" \
            --build-arg VITE_STRIPE_ORG_PRICE_ID="$VITE_STRIPE_ORG_PRICE_ID" \
            --build-arg VITE_UMAMI_URL="$VITE_UMAMI_URL" \
            --build-arg VITE_UMAMI_WEBSITE_ID="$VITE_UMAMI_WEBSITE_ID"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ steps.target.outputs.app }}
          VITE_STRIPE_TEAM_PRICE_ID: ${{ vars.VITE_STRIPE_TEAM_PRICE_ID }}
          VITE_STRIPE_ORG_PRICE_ID: ${{ vars.VITE_STRIPE_ORG_PRICE_ID }}
          VITE_UMAMI_URL: ${{ vars.VITE_UMAMI_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
