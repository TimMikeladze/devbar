# Shared config — deploy with: fly deploy -a deloop-dev / fly deploy -a deloop-prod
app = "deloop-prod"
primary_region = "ord"

[build]
dockerfile = "Dockerfile"
# Pass VITE_ vars as build args so the SPA bakes them in at build time
[build.args]
VITE_STRIPE_TEAM_PRICE_ID = ""
VITE_STRIPE_ORG_PRICE_ID = ""

[env]
NODE_ENV = "production"
DELOOP_STATIC_DIR = "./public"

[http_service]
internal_port = 3100
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
[http_service.concurrency]
type = "connections"
hard_limit = 1000
soft_limit = 800

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
