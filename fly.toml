app = "deloop"
primary_region = "ord"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
DELOOP_STATIC_DIR = "./public"
# For multi-instance: set DELOOP_FLY_INSTANCES to comma-separated machine IDs
# e.g. fly secrets set DELOOP_FLY_INSTANCES="machine1,machine2,machine3"
# This enables fly-replay room affinity for WebSocket collaboration.
# Without it, single-instance mode is used (works fine for most deployments).

[http_service]
internal_port = 3100
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
[http_service.concurrency]
type = "connections"
hard_limit = 1000
soft_limit = 800

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
